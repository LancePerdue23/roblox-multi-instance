name: Refresh download badge
on:
  release:
    types: [published]
  public:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-badge
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update package download total
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/Update-DownloadBadge.py
      - name: Commit changed badge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/badges/downloads.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh package download count"
            git push origin HEAD:main
          fi
