name: Refresh release badges
on:
  public:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-badge
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Badge regression checks
        run: python3 -m unittest discover -s scripts -p 'test_release_badges.py'
      - name: Update release badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/Update-DownloadBadge.py
      - name: Commit changed badge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/badges/downloads.svg docs/assets/badges/release.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh release badges"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
