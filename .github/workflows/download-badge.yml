name: Publish download badge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-badge.yml'
      - 'scripts/Update-DownloadBadge.py'
      - 'scripts/test_release_badges.py'
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: download-badge-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Badge regression checks
        run: python3 -m unittest discover -s scripts -p 'test_release_badges.py'
      - name: Generate download badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/Update-DownloadBadge.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/download-badge
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy badge artifact
        id: deployment
        uses: actions/deploy-pages@v4
